<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sporttörténeti kvíz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed-height shell — bal oldalt témalista, jobbra a kártya; a kártya alja mindig látszik. */
:root{
  --bg:#eef1f3;
  --panel:#ffffff;
  --side:#e4eaee;
  --line:#d3dce1;
  --ink:#131d24;
  --muted:#5a6f7c;
  --accent:#0d6d84;
  --accent-soft:#d9ecf1;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1519; --panel:#152128; --side:#111c22; --line:#283a44;
    --ink:#e9f2f6; --muted:#8ea6b3; --accent:#5cc2dd; --accent-soft:#17323c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1519; --panel:#152128; --side:#111c22; --line:#283a44;
  --ink:#e9f2f6; --muted:#8ea6b3; --accent:#5cc2dd; --accent-soft:#17323c;
  color-scheme: dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{
  height:100%; height:100dvh; overflow:hidden; margin:0;
  background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.45;
  display:grid; grid-template-columns:252px 1fr; gap:0;
}

/* ---- oldalsáv ---- */
.side{
  background:var(--side); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0;
  padding:16px 12px; gap:10px;
}
.brand{font-family:var(--display); font-weight:700; font-size:1rem; line-height:1.2; padding:0 6px; letter-spacing:-0.01em}
.brand small{display:block; font-family:var(--body); font-weight:400; font-size:.78rem; color:var(--muted); margin-top:2px}
.topics{list-style:none; margin:0; padding:0; overflow-y:auto; display:flex; flex-direction:column; gap:3px; min-height:0}
.topics button{
  width:100%; text-align:left; font:inherit; font-size:.88rem; line-height:1.25;
  color:var(--ink); background:transparent; border:1px solid transparent;
  border-radius:9px; padding:8px 10px; cursor:pointer;
  display:flex; justify-content:space-between; align-items:baseline; gap:8px;
}
.topics button:hover{background:var(--panel)}
.topics button[aria-current="true"]{background:var(--panel); border-color:var(--accent); color:var(--accent); font-weight:600}
.topics .n{font-size:.75rem; color:var(--muted); font-variant-numeric:tabular-nums; flex:0 0 auto}
.topics button[aria-current="true"] .n{color:var(--accent)}

/* ---- fő rész ---- */
.main{display:flex; flex-direction:column; min-width:0; min-height:0; padding:16px; gap:12px}
.bar{flex:0 0 auto; display:flex; align-items:baseline; justify-content:space-between; gap:12px; min-width:0}
h1{font-family:var(--display); font-weight:700; font-size:1.05rem; margin:0; letter-spacing:-0.01em; text-wrap:balance; min-width:0}
.counter{color:var(--muted); font-size:.85rem; font-variant-numeric:tabular-nums; white-space:nowrap}

.card{
  flex:1; min-height:0; background:var(--panel);
  border:1px solid var(--line); border-radius:16px; padding:20px;
  display:flex; flex-direction:column; gap:16px; cursor:pointer;
}
.photoWrap{flex:1 1 0; min-height:56px; display:flex; align-items:center; justify-content:center}
.photoWrap img{max-height:100%; max-width:100%; min-height:0; object-fit:contain; border-radius:10px; display:block}

.reveal{flex:0 0 auto; max-height:72%; overflow-y:auto; display:flex; flex-direction:column; gap:14px; min-width:0}
.card.qa .reveal{flex:1 1 auto; max-height:none; overflow:hidden; gap:0}
.card.qa .qslot{flex:0 0 auto}
.card.qa .aslot{
  flex:1 1 auto; min-height:0; overflow-y:auto;
  border-left:0; padding-left:0; padding-top:18px;
  display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;
}
.card.qa .atext{max-width:min(100%, 68ch)}
.slot{
  border-left:3px solid var(--line); padding-left:13px; min-width:0;
  opacity:0; transform:translateY(5px);
  transition:opacity .2s ease, transform .2s ease, border-color .2s ease;
}
.slot.on{opacity:1; transform:none; border-left-color:var(--accent)}
.slot .lab{display:block; font-size:.7rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
.qtext{font-family:var(--display); font-weight:700; font-size:clamp(1.25rem, 1.7vw + .8rem, 1.85rem); line-height:1.25; letter-spacing:-0.015em; text-wrap:balance}
.atext{font-size:clamp(1.3rem, 1.6vw + .85rem, 2.1rem); line-height:1.35; font-weight:500}
.name{font-family:var(--display); font-weight:700; font-size:1.5rem; line-height:1.15; letter-spacing:-0.015em}
.ev{margin-top:6px; line-height:1.45}
.ev:first-child{margin-top:0}
.ev .team{display:block; color:var(--muted); font-size:.87rem; line-height:1.35; margin-top:2px}

footer{flex:0 0 auto; display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.hint{color:var(--muted); font-size:.85rem}
kbd{font-family:var(--body); font-size:.78rem; color:var(--ink); background:var(--accent-soft); border:1px solid var(--line); border-radius:5px; padding:1px 6px}
.btns{display:flex; gap:8px}
button.act{
  font:inherit; font-size:.88rem; font-weight:500; color:var(--ink);
  background:var(--panel); border:1px solid var(--line);
  border-radius:9px; padding:7px 14px; cursor:pointer;
}
button.act:hover{border-color:var(--accent); color:var(--accent)}
button.act.primary{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
button.act:disabled{opacity:.45; cursor:default; color:var(--muted); border-color:var(--line); background:var(--panel)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

@media (prefers-reduced-motion: reduce){ .slot{transition:none} }

@media (max-width:760px){
  body{grid-template-columns:1fr; grid-template-rows:auto 1fr}
  .side{
    border-right:0; border-bottom:1px solid var(--line);
    flex-direction:row; align-items:center; gap:8px; padding:10px 16px; overflow:hidden;
  }
  .brand{flex:0 0 auto; font-size:.9rem}
  .brand small{display:none}
  .topics{flex-direction:row; overflow-x:auto; overflow-y:hidden; flex:1; padding-bottom:2px}
  .topics button{white-space:nowrap; width:auto; border-color:var(--line); background:var(--panel)}
  .main{padding:12px 16px}
  .qtext{font-size:1.15rem}
  .atext{font-size:1.15rem}
  .name{font-size:1.25rem}
  .ev{font-size:.95rem}
  .hint{display:none}
  .btns{width:100%}
  .btns button{flex:1}
}
</style>
</head>
<body>

<nav class="side">
  <div class="brand">Sporttörténeti kvíz<small>Buzánszky Jenő vetélkedő, 2026</small></div>
  <ul class="topics" id="topics"></ul>
</nav>

<div class="main">
  <div class="bar">
    <h1 id="title"></h1>
    <span class="counter" id="counter"></span>
  </div>

  <main class="card" id="card">
    <div class="photoWrap" id="photoWrap" hidden><img id="photo" alt="Versenyző fotója"></div>
    <div class="reveal" id="reveal"></div>
  </main>

  <footer>
    <span class="hint"><kbd>→</kbd> következő lépés · <kbd>←</kbd> vissza · <kbd>R</kbd> újrakeverés</span>
    <div class="btns">
      <button class="act" id="back" type="button">Vissza</button>
      <button class="act" id="shuffle" type="button">Újrakeverés</button>
      <button class="act primary" id="next" type="button">Válasz</button>
    </div>
  </footer>
</div>

  shuffle: document.getElementById('shuffle'),
};

let topic = null, order = [], idx = 0, step = 0;

const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const steps = () => (topic.kind === 'photo' ? 3 : 1);

function slot(id, label, html) {
  return '<div class="slot" data-i="' + id + '"><span class="lab">' + esc(label) + '</span>' + html + '</div>';
}
function evLines(list) {
  return list.map(r => '<div class="ev">' + esc(r.e) + (r.team ? '<span class="team">' + esc(r.team) + '</span>' : '') + '</div>').join('');
}
function aLines(list) {
  return list.map(t => '<div class="ev">' + esc(t) + '</div>').join('');
}

function buildTopicList() {
  TOPICS.forEach((t, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '<span>' + esc(t.title) + '</span><span class="n">' + t.items.length + '</span>';
    b.addEventListener('click', () => { selectTopic(i); b.blur(); });
    li.appendChild(b);
    el.topics.appendChild(li);
  });
}

function selectTopic(i) {
  topic = TOPICS[i];
  [...el.topics.querySelectorAll('button')].forEach((b, k) => b.setAttribute('aria-current', k === i ? 'true' : 'false'));
  el.title.textContent = topic.title;
  el.card.classList.toggle('qa', topic.kind !== 'photo');
  el.shuffle.textContent = topic.ordered ? 'Elölről' : 'Újrakeverés';
  el.photoWrap.hidden = topic.kind !== 'photo';
  try { localStorage.setItem('temakor', String(i)); } catch (e) {}
  shuffle();
}

function shuffle() {
  order = topic.items.map((_, i) => i);
  if (!topic.ordered) {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  }
  idx = 0; step = 0; render();
}

function render() {
  const it = topic.items[order[idx]];
  if (topic.kind === 'photo') {
    el.photo.src = 'photos/' + it.f;
    el.photo.alt = step >= 1 ? it.n : 'Ki ez a versenyző?';
    el.reveal.innerHTML =
      slot(0, 'Versenyző', '<span class="name">' + esc(it.n) + '</span>') +
      slot(1, 'Párizs, 2024', evLines(it.p)) +
      slot(2, 'Tokió, 2021', evLines(it.t));
  } else {
    el.reveal.innerHTML =
      '<div class="slot on qslot"><span class="lab">Kérdés</span><div class="qtext">' + esc(it.q) + '</div></div>' +
      '<div class="slot aslot" data-i="0"><div class="atext">' + aLines(it.a) + '</div></div>';
  }
  [...el.reveal.querySelectorAll('.slot[data-i]')].forEach(s => {
    s.classList.toggle('on', step > Number(s.dataset.i));
  });
  el.counter.textContent = (idx + 1) + ' / ' + order.length;
  el.back.disabled = atStart();
  el.next.textContent = step < steps() ? 'Válasz' : 'Következő';
  if (topic.kind === 'photo') el.next.textContent = step < 3 ? 'Tovább' : 'Következő';
}

const atStart = () => idx === 0 && step === 0;

function next() {
  if (step < steps()) step++;
  else { idx = (idx + 1) % order.length; step = 0; }
  render();
}
function back() {
  if (atStart()) return;
  if (step > 0) step--; else { idx = idx - 1; step = steps(); }
  render();
}

document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('footer') && (e.code === 'Space' || e.key === 'Enter')) return;
  if (e.code === 'Space' || e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
  else if (e.key === 'r' || e.key === 'R') { shuffle(); }
});
el.card.addEventListener('click', next);
el.next.addEventListener('click', e => { e.stopPropagation(); next(); });
el.back.addEventListener('click', e => { e.stopPropagation(); back(); });
el.shuffle.addEventListener('click', e => { e.stopPropagation(); shuffle(); });

buildTopicList();
let start = 0;
try { const v = Number(localStorage.getItem('temakor')); if (v >= 0 && v < TOPICS.length) start = v; } catch (e) {}
selectTopic(start);
</script>
</body>
</html>
